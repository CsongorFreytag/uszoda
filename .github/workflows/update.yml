name: Update ics

on:
  schedule:
    - cron: "0 5 * * *"   # naponta 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python uszoda_ics.py uszoda.ics
      - name: Commit if changed
        run: |
          # a DTSTAMP minden futásnál változik, ezért csak az események változását nézzük
          if git diff --quiet -I'^DTSTAMP' -- uszoda.ics; then
            echo "nincs változás"
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add uszoda.ics
            git commit -m "Update uszoda.ics"
            git push
          fi
